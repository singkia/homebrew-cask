# [INPUT]: 依赖缓存配置变更或定时事件；仅 Homebrew 上游运行。
# [OUTPUT]: 为 macOS 15、26 与 Ubuntu 缓存 Homebrew Gems。
# [POS]: workflows 的依赖缓存入口；保留按 runner 隔离的缓存键。
# [PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md
name: Cache

on:
  push:
    paths:
      - .github/workflows/cache.yml
  schedule:
    - cron: "0 */6 * * *" # every 6 hours

concurrency:
  group: cache
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  update:
    if: github.repository_owner == 'Homebrew'
    strategy:
      matrix:
        runner:
          - macos-15
          - macos-26
          - ubuntu-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@f8d4222eb633e65c2a0157383cf80861fc7fae7f # 2026.09.07.1
        with:
          core: false
          cask: false

      - name: Cache Homebrew Gems
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.runner }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.runner }}-rubygems-

      - name: Install Homebrew Gems
        id: gems
        run: brew install-bundler-gems --groups=audit,style
